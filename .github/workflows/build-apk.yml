name: Compilar APK strawchell

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto web
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (Release / Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk strawchell.apk

      - name: Subir artefacto APK generado
        uses: actions/upload-artifact@v4
        with:
          name: strawchell-apk
          path: strawchell.apk

      - name: Publicar Release en GitHub con el APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: strawchell.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

